
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student - SmartAttend AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6fb;
            color: #1e293b;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: 25px auto;
        }

        .header {
            background: linear-gradient(120deg, #312e81, #6366f1);
            color: white;
            padding: 28px;
            border-radius: 18px 18px 0 0;
        }

        .header h1 {
            font-size: 25px;
            margin-bottom: 7px;
        }

        .header p {
            color: #e0e7ff;
            font-size: 14px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 0 0 18px 18px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.06);
        }

        .form-title {
            font-size: 18px;
            margin-bottom: 22px;
            color: #1e293b;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
        }

        input, select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dbe1ea;
            border-radius: 9px;
            background: #f8fafc;
            color: #1e293b;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(120deg, #4f46e5, #6366f1);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.25);
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .flash-message {
            padding: 12px 15px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #dcfce7;
            color: #166534;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .form-card {
                padding: 22px;
            }

            .header {
                padding: 23px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Edit Student</h1>
        <p>Update student personal and academic information.</p>
    </div>

    <div class="form-card">

        <h2 class="form-title">Student Information</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <div class="form-group">
                <label>Student Name</label>
                <input type="text"
                       name="name"
                       value="{{ student.name }}"
                       placeholder="Enter student full name"
                       required>
            </div>

            <div class="form-group">
                <label>Roll Number</label>
                <input type="text"
                       name="roll_number"
                       value="{{ student.roll_number }}"
                       placeholder="Enter roll number"
                       required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email"
                       name="email"
                       value="{{ student.email }}"
                       placeholder="Enter student email"
                       required>
            </div>

            <div class="form-group">
                <label>Course</label>
                <select name="course" required>

                    <option value="">-- Select Course --</option>

                    {% for course in courses %}
                        <option value="{{ course.course_name }}"
                            {% if student.course == course.course_name %}selected{% endif %}>
                            {{ course.course_name }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <div class="form-group">
                <label>Semester</label>
                <select name="semester" required>

                    <option value="">-- Select Semester --</option>

                    {% for sem in ["1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th"] %}
                        <option value="{{ sem }}"
                            {% if student.semester == sem %}selected{% endif %}>
                            {{ sem }} Semester
                        </option>
                    {% endfor %}

                </select>
            </div>

            <button type="submit" class="submit-btn">
                Update Student
            </button>

        </form>

        <a class="back-link"
           href="{{ url_for('student.student_list') }}">
            ← Back to Student List
        </a>

    </div>

</div>

</body>
</html>
