
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartAttend AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 650px;
            padding: 45px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px #00000012;
        }

        h1 {
            color: #2563eb;
            margin-bottom: 15px;
        }

        p {
            color: #64748b;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background: #dcfce7;
            color: #166534;
            border-radius: 25px;
            font-weight: bold;
        }

        .footer {
            margin-top: 35px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>SmartAttend AI</h1>

        <h3>Smart Attendance Management System</h3>

        <br>

        <p>
            AI-powered attendance using Face Recognition
            and Dynamic QR Code Technology.
        </p>

        <div class="status">
            ● Application Successfully Started
        </div>

        <div class="footer">
            B.Tech CSE Mini Project | 2026
        </div>

    </div>

</body>
</html>
