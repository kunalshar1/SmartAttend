
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enroll Student | SmartAttend AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Enroll Student in Subject</h2>

    <form method="POST">

        <label>Select Student</label>

        <select name="student_id" required>
            <option value="">-- Select Student --</option>

            {% for student in students %}
            <option value="{{ student.id }}">
                {{ student.name }} ({{ student.roll_number }})
            </option>
            {% endfor %}

        </select>

        <label>Select Subject</label>

        <select name="subject_id" required>
            <option value="">-- Select Subject --</option>

            {% for subject in subjects %}
            <option value="{{ subject.id }}">
                {{ subject.subject_name }} ({{ subject.subject_code }})
            </option>
            {% endfor %}

        </select>

        <button type="submit">Enroll Student</button>

    </form>

    <a href="{{ url_for('enrollment.enrollment_list') }}">
        Back to Enrollments
    </a>

</div>

</body>
</html>
