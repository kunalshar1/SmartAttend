
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Management - SmartAttend AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            padding: 30px 15px;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
        }

        .header {
            background: linear-gradient(120deg, #1e1b4b, #4338ca, #7c3aed);
            color: white;
            padding: 30px;
            border-radius: 18px 18px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 7px;
        }

        .header p {
            color: #e0e7ff;
            font-size: 14px;
        }

        .add-btn {
            display: inline-block;
            padding: 12px 18px;
            background: white;
            color: #4338ca;
            border-radius: 9px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: 0.2s;
        }

        .add-btn:hover {
            background: #eef2ff;
            transform: translateY(-2px);
        }

        .content-card {
            background: white;
            padding: 30px;
            border-radius: 0 0 18px 18px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
        }

        .section-title {
            font-size: 19px;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 550px;
        }

        th, td {
            padding: 16px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        th {
            background: #eef2ff;
            color: #3730a3;
            font-weight: 700;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .course-id {
            color: #64748b;
            font-weight: 600;
        }

        .course-name {
            color: #1e293b;
            font-weight: 600;
        }

        .delete-btn {
            padding: 9px 15px;
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: #dc2626;
            color: white;
        }

        .delete-form {
            display: inline;
        }

        .empty-state {
            text-align: center;
            padding: 35px 15px;
            color: #64748b;
        }

        .empty-state strong {
            display: block;
            color: #334155;
            margin-bottom: 7px;
            font-size: 16px;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .header {
                padding: 23px;
            }

            .header h1 {
                font-size: 22px;
            }

            .content-card {
                padding: 20px;
            }

            .add-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>Course Management</h1>
            <p>Manage all courses registered in SmartAttend AI.</p>
        </div>

        <a class="add-btn" href="{{ url_for('course.add_course') }}">
            ＋ Add New Course
        </a>
    </div>

    <div class="content-card">

        <h2 class="section-title">All Courses</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Course ID</th>
                        <th>Course Name</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                    {% for course in courses %}
                    <tr>
                        <td class="course-id">#{{ course.id }}</td>

                        <td class="course-name">
                            {{ course.course_name }}
                        </td>

                        <td>
                            <form class="delete-form"
                                  method="POST"
                                  action="{{ url_for('course.delete_course', id=course.id) }}"
                                  onsubmit="return confirm('Are you sure you want to delete this course?')">

                                <button class="delete-btn" type="submit">
                                    Delete
                                </button>

                            </form>
                        </td>
                    </tr>

                    {% else %}
                    <tr>
                        <td colspan="3">
                            <div class="empty-state">
                                <strong>No Courses Found</strong>
                                No courses have been added yet.
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <a class="back-link" href="{{ url_for('admin_dashboard') }}">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
