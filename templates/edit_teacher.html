
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Teacher - SmartAttend AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: linear-gradient(135deg, #312e81, #7c3aed);
            color: white;
            font-size: 28px;
        }

        h2 {
            color: #1e293b;
            margin: 0 0 8px;
            font-size: 25px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: linear-gradient(135deg, #312e81, #7c3aed);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #6d28d9;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .flash {
            padding: 11px 13px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="icon">✎</div>
        <h2>Edit Teacher</h2>
        <div class="subtitle">Update teacher account information</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label>Teacher Name</label>
        <input type="text"
               name="name"
               value="{{ teacher.name }}"
               placeholder="Enter teacher name"
               required>

        <label>Email Address</label>
        <input type="email"
               name="email"
               value="{{ teacher.email }}"
               placeholder="Enter email address"
               required>

        <button type="submit">Update Teacher</button>

    </form>

    <a class="back-link" href="{{ url_for('teacher.teacher_list') }}">
        ← Back to Teacher List
    </a>

</div>

</body>
</html>
