
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Subject - SmartAttend AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            padding: 30px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            margin: 25px auto;
        }

        .header {
            background: linear-gradient(120deg, #1e1b4b, #4338ca, #7c3aed);
            color: white;
            padding: 30px;
            border-radius: 18px 18px 0 0;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .header p {
            color: #e0e7ff;
            font-size: 14px;
        }

        .form-card {
            background: white;
            padding: 32px;
            border-radius: 0 0 18px 18px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
        }

        .form-title {
            font-size: 19px;
            margin-bottom: 25px;
            color: #1e293b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
        }

        input, select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dbe1ea;
            border-radius: 9px;
            background: #f8fafc;
            color: #1e293b;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(120deg, #312e81, #6366f1);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.25);
        }

        .back-link {
            display: inline-block;
            margin-top: 23px;
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .flash-message {
            padding: 12px 15px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #dcfce7;
            color: #166534;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .form-card {
                padding: 22px;
            }

            .header {
                padding: 24px;
            }

            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>✎ Edit Subject</h1>
        <p>Update subject details, course, semester and assigned teacher.</p>
    </div>

    <div class="form-card">

        <h2 class="form-title">Subject Information</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <div class="form-group">
                <label>Subject Name</label>
                <input type="text"
                       name="subject_name"
                       value="{{ subject.subject_name }}"
                       placeholder="Enter subject name"
                       required>
            </div>

            <div class="form-group">
                <label>Subject Code</label>
                <input type="text"
                       name="subject_code"
                       value="{{ subject.subject_code }}"
                       placeholder="Enter subject code"
                       required>
            </div>

            <div class="form-group">
                <label>Course</label>
                <select name="course" required>
                    <option value="">-- Select Course --</option>

                    {% for course in courses %}
                        <option value="{{ course.course_name }}"
                            {% if subject.course == course.course_name %}selected{% endif %}>
                            {{ course.course_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Semester</label>
                <select name="semester" required>
                    <option value="">-- Select Semester --</option>

                    {% for sem in ["1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th"] %}
                        <option value="{{ sem }}"
                            {% if subject.semester == sem %}selected{% endif %}>
                            {{ sem }} Semester
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Assign Teacher</label>
                <select name="teacher_id">
                    <option value="">-- No Teacher --</option>

                    {% for teacher in teachers %}
                        <option value="{{ teacher.id }}"
                            {% if subject.teacher_id == teacher.id %}selected{% endif %}>
                            {{ teacher.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="submit-btn">
                Update Subject
            </button>

        </form>

        <a class="back-link"
           href="{{ url_for('subject.subject_list') }}">
            ← Back to Subject List
        </a>

    </div>

</div>

</body>
</html>
